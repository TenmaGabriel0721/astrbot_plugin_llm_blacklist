name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run checks
        env:
          TMPDIR: ${{ runner.temp }}
          RUFF_CACHE_DIR: ${{ runner.temp }}/llm-blacklist-ruff
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/llm-blacklist-pycache
        run: |
          ruff check .
          ruff format --check .
          python -m pytest -q
