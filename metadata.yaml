name: astrbot_plugin_llm_blacklist
display_name: 下头，拉黑了
short_desc: 全局临时与永久拉黑，保存目标昵称，黑名单查询向所有人开放。
desc: 为 AstrBot 提供全局临时与永久拉黑、目标昵称持久化、公开黑名单查询、管理员解封，以及平台实例与 Bot 隔离。
help: 所有人（含被拉黑用户）可查看 ~黑名单，或使用 查询、列表、帮助。管理员可使用 ~拉黑、~永久拉黑、~解除拉黑；目标支持 @用户或用户ID，封禁全局生效并保存昵称。
version: 1.3.0
